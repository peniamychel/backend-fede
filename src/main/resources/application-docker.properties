# Perfil para el entorno aislado de integración/producción de Docker Desktop.
# Desarrollo continúa usando application.properties y el .env local.

server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

federa.registro-api.habilitado=${REGISTRO_API_HABILITADO:true}
federa.seguridad.exigir-autenticacion=${EXIGIR_AUTENTICACION:false}

federa.almacenamiento.raiz=${FEDERA_ALMACENAMIENTO_RAIZ:/data/almacenamiento}

federa.backup.raiz=${BACKUP_RAIZ:/data/respaldos}
federa.backup.ejecutable=${MARIADB_DUMP:/usr/bin/mariadb-dump}
federa.backup.host=${BACKUP_DB_HOST:federa-db}
federa.backup.puerto=${BACKUP_DB_PUERTO:3306}

# Evita que una caída temporal de Internet afecte por mucho tiempo una consulta
# SIE. El resto del padrón continúa operando dentro de la intranet.
federa.sie.conexion-segundos=${SIE_CONEXION_SEGUNDOS:5}
federa.sie.lectura-segundos=${SIE_LECTURA_SEGUNDOS:15}
