spring.application.name=backend
# Spring interpreta el archivo .env como un archivo de propiedades. Es opcional
# para que el artefacto tambien pueda desplegarse usando variables del sistema.
spring.config.import=optional:file:.env[.properties]
server.port=8080

# Una linea por llamada a /api/** en la consola de ejecucion. No registra
# cuerpos, parametros ni cabeceras para no exponer datos personales o tokens.
federa.registro-api.habilitado=true

# El servidor en el 3307 es MariaDB 11.4.2, asi que se usa su driver nativo.
# sslMode=disable reemplaza al useSSL=false de MySQL; serverTimezone y
# allowPublicKeyRetrieval eran especificos de MySQL y no hacen falta aca.
#
# sessionVariables no es decorativo: el servidor tiene character_set_server=latin1,
# asi que en una maquina nueva createDatabaseIfNotExist crearia la base en latin1 y
# los nombres del padron con acentos volverian a romperse. Forzando estas dos
# variables en la sesion, la base se crea en utf8mb4 sin tener que tocar my.ini.
#
# Los valores se leen desde el .env local o desde variables del sistema. No hay
# credenciales de respaldo dentro del codigo: si falta alguna, el backend falla
# al iniciar en vez de conectarse silenciosamente con otra cuenta.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Sin dialecto explicito a proposito: con este driver Hibernate lee la metadata
# JDBC y elige MariaDBDialect con la version correcta. Fijarlo a mano era lo que
# obligaba a usar MySQLDialect contra un servidor MariaDB.
spring.jpa.properties.hibernate.format_sql=true

# El limite de fabrica es 1MB por archivo. Se sube a 25MB por dos motivos:
# la planilla MATRIX (~270KB hoy, crece con cada revision) y sobre todo las
# fotos, que se aceptan en el tamano en que salen de la camara. El servidor las
# reduce al guardarlas, asi que este limite es solo un tope de cordura para no
# quedarse sin memoria con un archivo absurdo.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Ojo con la expectativa: las entidades usan GenerationType.IDENTITY, y con esa
# estrategia Hibernate NO puede agrupar los INSERT, porque necesita el id que
# genera la base en cada fila. Estas propiedades no aceleran la importacion.
# Quedan porque si ayudan a los UPDATE y al resto de la aplicacion.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Seguridad
# ---------------------------------------------------------------------------
# El inicio de sesion YA FUNCIONA y emite tokens validos. Lo que esta apagado es
# la exigencia: con false, el padron sigue respondiendo sin token, para no
# romper el cliente mientras no tenga pantalla de login.
#
# Al poner true, todo /api/v1 pide "Authorization: Bearer <token>" salvo
# /auth/**, la documentacion, y GET /archivos/** (una etiqueta <img> del
# navegador no puede mandar cabeceras).
federa.seguridad.exigir-autenticacion=false

# Origenes web que pueden llamar a la API. Los patrones de red local evitan
# tener que editar esta lista cuando el router asigne otra IP a la máquina.
# CORS_ORIGENES permite reemplazarlos al desplegar el sistema.
federa.seguridad.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173}

# Clave de firma en base64, minimo 32 bytes. Si se deja vacia se genera una al
# arrancar: sirve para probar, pero las sesiones se caen en cada reinicio.
#   Generar una:  openssl rand -base64 48
# En serio va por variable de entorno: es la clave que valida todos los tokens.
federa.seguridad.jwt.clave=${JWT_CLAVE:}
federa.seguridad.jwt.duracion-horas=12

# Usuario que se crea solo la primera vez, cuando no hay ninguno.
# admin/admin sirve para arrancar en una maquina nueva; en cualquier equipo que
# no sea el propio hay que pasar otra por variable de entorno.
federa.seguridad.usuario-inicial=${ADMIN_USUARIO:admin}
federa.seguridad.contrasena-inicial=${ADMIN_CONTRASENA:admin}

# Almacen de objetos: donde se guardan las fotos de los productores. En la base
# solo queda la clave con la que encontrarlas.
#
# En produccion conviene una ruta ABSOLUTA fuera del directorio de la
# aplicacion: si queda adentro, un redespliegue que limpie la carpeta se lleva
# las fotos por delante.
federa.almacenamiento.raiz=./almacenamiento

# ---------------------------------------------------------------------------
# Copias de seguridad de MariaDB
# ---------------------------------------------------------------------------
# El botón del panel y el programador interno de Spring usan el mismo motor.
# No se crea ninguna tarea en Windows. Si el backend está apagado a la hora del
# cron, ese respaldo no se ejecuta.
federa.backup.habilitado=${BACKUP_HABILITADO:true}
federa.backup.raiz=${BACKUP_RAIZ:./respaldos}
federa.backup.ejecutable=${MARIADB_DUMP:C:/Program Files/MariaDB 11.4/bin/mariadb-dump.exe}
federa.backup.archivo-credenciales=${BACKUP_ARCHIVO_CREDENCIALES:}
federa.backup.host=${BACKUP_DB_HOST:localhost}
federa.backup.puerto=${BACKUP_DB_PUERTO:3307}
federa.backup.base-datos=${BACKUP_DB_NOMBRE:federa}
federa.backup.usuario=${BACKUP_DB_USUARIO:${DB_USUARIO}}
federa.backup.contrasena=${BACKUP_DB_CONTRASENA:${DB_CONTRASENA}}
federa.backup.max-duracion-minutos=${BACKUP_MAX_MINUTOS:30}

federa.backup.automatico.habilitado=${BACKUP_AUTOMATICO:true}
federa.backup.automatico.cron=${BACKUP_CRON:0 0 2 * * *}
federa.backup.automatico.zona=${BACKUP_ZONA:America/La_Paz}
federa.backup.retencion.diarios=${BACKUP_RETENCION_DIARIOS:7}
federa.backup.retencion.semanales=${BACKUP_RETENCION_SEMANALES:4}
federa.backup.retencion.mensuales=${BACKUP_RETENCION_MENSUALES:12}

# ---------------------------------------------------------------------------
# Consulta de identidad SIE
# ---------------------------------------------------------------------------
# El token nunca va al frontend ni al repositorio. Se entrega al proceso del
# backend mediante la variable SIE_TOKEN y se puede rotar sin recompilar.
federa.sie.habilitado=${SIE_HABILITADO:true}
federa.sie.url=${SIE_URL:https://api.itt.sie.gob.bo/persona/busqueda}
federa.sie.token=${SIE_TOKEN:}
federa.sie.conexion-segundos=${SIE_CONEXION_SEGUNDOS:5}
federa.sie.lectura-segundos=${SIE_LECTURA_SEGUNDOS:15}

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
# devtools reinicia la app al cambiar target/classes. Sin esta exclusion,
# escribir una foto dentro de ./almacenamiento dispararia un reinicio.
spring.devtools.restart.exclude=almacenamiento/**,respaldos/**

# Swagger UI en http://localhost:8080/swagger-ui.html
# Especificacion OpenAPI cruda en http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
